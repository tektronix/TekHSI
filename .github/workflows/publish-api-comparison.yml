---
name: Publish API Breaking Change Check Results
on:
  # workflow_run is used intentionally here (not checking out or executing untrusted PR code
  # directly) to safely obtain "checks"/"pull-requests" write permissions for commenting on PRs
  # from forks, which "pull_request"-triggered workflows cannot be granted for security reasons.
  # The actual work is delegated to a pinned, version-tagged, trusted reusable workflow.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [Check Public API for Breaking Changes]
    types: [completed]
jobs:
  publish-api-comparison:
    uses: tektronix/python-package-ci-cd/.github/workflows/_reusable-publish-api-comparison.yml@v1.10.1
    permissions:
      checks: write
      pull-requests: write
