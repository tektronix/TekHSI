---
name: Check Public API for Breaking Changes
on:
  pull_request:
    branches: [main]
jobs:
  check-api-for-breaking-changes:
    name: Check API for breaking changes
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: tekhsi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - name: Install package to check
        run: |
          python -m pip install --upgrade .
          python -m pip install griffe
      - name: Prepare API-check source tree
        run: |
          cp -R src "$RUNNER_TEMP/tekhsi-api-src"
          find "$RUNNER_TEMP/tekhsi-api-src" -type f \( \
            -name '*_pb2.py' -o \
            -name '*_pb2.pyi' -o \
            -name '*_pb2_grpc.py' \
          \) -delete
      - name: Check API for breaking changes
        run: |
          griffe check --format=verbose \
            --against="$(git rev-parse origin/main)" \
            --search="$RUNNER_TEMP/tekhsi-api-src" "$PACKAGE_NAME" \
            2>&1 | tee breaking_changes.md
      - name: Upload API comparison results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: breaking_changes
          path: breaking_changes.md
